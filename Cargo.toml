[package]
name = "gui-app-passwords"
version = "0.1.0"
edition = "2021"
authors = ["Foundation Devices, Inc. <hello@foundation.xyz>"]
license = "GPL-3.0-or-later"

[workspace]
exclude = [".foundation-sdk", "logic"]

[dependencies]
# KeyOS plumbing. The Foundation CLI creates the project-local .foundation-sdk
# mapping automatically; no KeyOS source checkout is required.
log = "0.4"
log-server = { package = "xous-api-log", path = ".foundation-sdk/current/lib/keyos/xous/api/log" }
security = { path = ".foundation-sdk/current/lib/keyos/api/security" }
serde = { version = "1", features = ["derive"] }
server = { path = ".foundation-sdk/current/lib/keyos/server" }
settings = { path = ".foundation-sdk/current/lib/keyos/api/settings" }
slint-keyos-platform = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = ".foundation-sdk/current/lib/keyos/sdk/crates/foundation-themes" }
usb = { path = ".foundation-sdk/current/lib/keyos/api/usb" }
file-backed = { path = ".foundation-sdk/current/lib/keyos/utils/file-backed" }
fs = { path = ".foundation-sdk/current/lib/keyos/api/fs" }

# Cross-target utilities
async-trait = "0.1"
anyhow = "1"
hex = "0.4"
oneshot = "0.1"
serde_json = "1"
# Force transitive random users onto KeyOS' Xous-aware getrandom fork.
getrandom = "=0.2.10"
# Keep this aligned with KeyOS' lockfile. simd-adler32 0.3.9 uses ARM NEON
# intrinsics that are unstable with the current armv7a-unknown-xous-elf toolchain.
simd-adler32 = "=0.3.7"
thiserror = "1"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

# Vaults Bridge logic crates, vendored under ./logic (its own sub-workspace).
vaults-bridge-core = { path = "logic/vaults-bridge-core" }
vaults-bridge-protocol = { path = "logic/vaults-bridge-protocol" }
vaults-bridge-keystore = { path = "logic/vaults-bridge-keystore" }
vaults-bridge-import = { path = "logic/vaults-bridge-import" }

# tokio + tokio-tungstenite power the WebSocket transport used by the
# hosted-mode simulator. mio doesn't compile for Xous so restrict to host.
[target.'cfg(not(target_os = "xous"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
dirs = "5"

[target.'cfg(target_os = "xous")'.dependencies]
xous = { path = ".foundation-sdk/current/lib/keyos/xous/xous-rs" }

[build-dependencies]
slint-keyos-platform-build = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/build", default-features = false }

[patch.crates-io]
getrandom = { path = ".foundation-sdk/current/lib/keyos/imports/getrandom" }
# Pin the Slint graph to the exact Foundation fork shipped by the SDK so two
# Slint ABIs cannot enter the device link (matches the Cake signer / 1.4 SDK).
slint = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
slint-build = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
slint-macros = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-common = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-compiler = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-core = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-core-macros = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-backend-selector = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
i-slint-renderer-software = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
const-field-offset = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }
const-field-offset-macro = { git = "https://github.com/Foundation-Devices/slint.git", tag = "v1.17.0-foundation2" }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
