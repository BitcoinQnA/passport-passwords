# Foundation application configuration
app-name = "gui-app-passwords"
friendly-app-name = "Passwords"
launcher-app-name = "Passwords"
description = "Hardware-backed password manager for Passport Prime"
icon = "resources/icon.svg"
theme = "resources/theme.json"
app-id = "0x50617373776f72647300000000000000"
min-keyos-version = "1.5.0"
signing-identity = "passwords"

[publisher]
name = "Foundation Devices, Inc."
contact-email = "hello@foundation.xyz"
support-url = "https://foundation.xyz"

navigation-permissions = ["os/files/PickPaths"]

[permissions]
"os/fs" = [
    "OpenDirMessage",
    "OpenFileMessage",
    "CloseFile",
    "CloseDir",
    "CreateDirMessage",
    "ReadFile",
    "SeekFile",
    "WriteFile",
    "TruncateFile",
    "SetLen",
    "GetMetadata",
    "NextEntry",
    "Flush",
    "Remove",
    "Rename",
    "AtomicCopy",
    "AsyncRead",
    "AsyncWrite",
    "AsyncCopyBlock",
    "SubscribeFilesystemEvent",
    "MapFileMessage",
    "GetAirlockReadAccess",
    "GetUserReadAccess",
    "GetUsbReadAccess",
]
"os/gui-server" = [
    "RegisterAppMessage",
    "RequestRedraw",
    "AnimateNextFrame",
    "SubmitFrame",
    "UpdateKeyboard",
    "HideKeyboard",
    "Navigate",
    "GetPendingNavRequest",
    "FinishResponse",
    "NavigationCancel",
]
"os/settings" = [
    "GetSystemTheme",
    "SubscribeSystemTheme",
    "GetDebugTouch",
    "SubscribeDebugTouch",
]
"os/security" = [
    "GetAppSeed",
]
"os/ql" = [
    "OpenStream",
    "SubscribeIncomingStreams",
    "ReadStream",
    "WriteStream",
    "FinishStream",
    "ResetStream",
    "WaitForWriterClosed",
    "SubscribeStatus",
    "GetStatus",
]
